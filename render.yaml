# Render Blueprint for the live demo (free plan). PostgreSQL is hosted on Neon, not Render.
services:
  - type: web
    name: order-inventory-api
    runtime: docker
    plan: free
    region: frankfurt
    dockerContext: ./api
    dockerfilePath: ./api/Dockerfile
    # Liveness only: a slow database wake-up should not make Render restart the API.
    healthCheckPath: /health/live
    buildFilter:
      paths:
        - api/src/**
        - api/Dockerfile
        - api/Directory.Build.props
    envVars:
      - key: PORT
        value: "8080"
      - key: ConnectionStrings__Default
        sync: false
      - key: Database__MigrateOnStartup
        value: "true"
      - key: Database__SeedDemoData
        value: "true"
      # Signs the access tokens. Render generates a random value once and keeps it; it is never committed.
      - key: Jwt__SigningKey
        generateValue: true

  - type: web
    name: order-inventory-client
    runtime: static
    rootDir: client
    buildCommand: npm ci && npm run build
    staticPublishPath: dist/client/browser
    envVars:
      - key: NODE_VERSION
        value: "24"
    routes:
      # Same-origin proxy to the API, mirroring proxy.conf.json in development (no CORS needed).
      # Render appended a suffix to the API's onrender.com name (the plain one was taken).
      # If the API service is ever recreated, check its URL and update this destination.
      - type: rewrite
        source: /api/*
        destination: https://order-inventory-api-wjwq.onrender.com/*
      # Angular client-side routing: unknown paths serve the app shell.
      - type: rewrite
        source: /*
        destination: /index.html
