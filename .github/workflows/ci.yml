name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: API build & test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore OrderInventory.slnx

      - name: Build
        run: dotnet build OrderInventory.slnx --configuration Release --no-restore

      # Integration tests use Testcontainers; ubuntu-latest runners ship with Docker.
      - name: Test
        run: dotnet test --solution OrderInventory.slnx --configuration Release --no-build --report-xunit-trx

      # Turns each failed test into an annotation, so failures show on the PR without opening the log.
      - name: Annotate failed tests
        if: failure()
        run: |
          python3 - <<'PY'
          import glob
          import xml.etree.ElementTree as ET

          ns = "{http://microsoft.com/schemas/VisualStudio/TeamTest/2010}"
          for path in glob.glob("**/*.trx", recursive=True):
              for result in ET.parse(path).getroot().iter(ns + "UnitTestResult"):
                  if result.get("outcome") != "Failed":
                      continue
                  message = result.find(f".//{ns}Message")
                  stack = result.find(f".//{ns}StackTrace")
                  text = "\n".join(t.text.strip() for t in (message, stack) if t is not None and t.text)
                  text = text[:3000].replace("%", "%25").replace("\r", "").replace("\n", "%0A")
                  title = result.get("testName", "test").replace("%", "%25").replace(",", "%2C").replace(":", "%3A")
                  print(f"::error title={title}::{text}")
          PY

      # Same image the demo host deploys; catches a broken Dockerfile before it reaches deploy.
      - name: Build Docker image
        run: docker build --tag order-inventory-api .

  client:
    name: Client build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Install
        run: npm ci

      - name: Build
        run: npm run build
